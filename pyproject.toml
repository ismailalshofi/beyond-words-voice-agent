[project]
name = "beyond-words-voice-agent"
version = "0.2.0"
description = "A real-time voice agent that listens to how you say something: signals -> state -> policy -> LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    "websockets>=14.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["app", "app.listening", "app.routers", "app.services", "app.voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends() in argument defaults is the intended pattern
ignore = ["B008"]
